plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'io.github.nayrasolcr.forough'
    compileSdk 35
    ndkVersion '27.0.12077973'

    lint {
        // The release APK must build without lint blocking the pipeline;
        // correctness is covered by the engine integration tests.
        checkReleaseBuilds false
        abortOnError false
    }

    defaultConfig {
        applicationId "io.github.nayrasolcr.forough"
        minSdk 24
        targetSdk 35
        versionCode 20001
        versionName "2.0.1"
    }

    signingConfigs {
        release {
            // Community distribution keystore, committed on purpose so that
            // release APKs keep a stable signing identity across builds and
            // users can install updates without uninstalling.
            // (FOSS sideload distribution — the signature guarantees update
            // consistency, not publisher trust; the source is the trust.)
            storeFile file('keystore/forough-release.keystore')
            storePassword 'forough'
            keyAlias 'forough'
            keyPassword 'forough'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        ndk {
            // Same device coverage as the Psiphon library; x86_64 included
            // for emulator testing.
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // tun2socks native library (badvpn), shared with the legacy Psiphon app
    // module so the NDK source lives in exactly one place in the repository.
    externalNativeBuild {
        ndkBuild {
            path file('../../app/src/main/jni/Android.mk')
        }
    }
}

dependencies {
    // Psiphon tunnel-core engine (fork with quality-ranked CDN edges),
    // produced by the `build-aar` CI job and downloaded into app/libs/.
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
}
